# Production stack: Caddy (TLS) + Signl1 web + poller.
# Copy .env.example → .env, set DOMAIN and AUTH_*, then:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Do not publish port 3847. Operators reach the desk only through Caddy on 80/443.

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the hostname you purchased}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    command: npm run start
    expose:
      - "3847"
    environment:
      DATABASE_PATH: /data/signal.db
      PORT: "3847"
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: https://${DOMAIN}
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_LOGIN: "0"
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      KOL_HANDLES: ${KOL_HANDLES:-}
      KOL_HANDLES_MODE: ${KOL_HANDLES_MODE:-append}
      BLOCKED_HANDLES: ${BLOCKED_HANDLES:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
    volumes:
      - signal-data:/data
    restart: unless-stopped

  poller:
    build: .
    command: npm run poller
    environment:
      DATABASE_PATH: /data/signal.db
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      KOL_HANDLES: ${KOL_HANDLES:-}
      KOL_HANDLES_MODE: ${KOL_HANDLES_MODE:-append}
      BLOCKED_HANDLES: ${BLOCKED_HANDLES:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
    volumes:
      - signal-data:/data
    restart: unless-stopped

volumes:
  signal-data:
  caddy-data:
  caddy-config:
