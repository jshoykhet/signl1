services:
  web:
    build: .
    command: npm run start
    ports:
      - "3847:3847"
    environment:
      DATABASE_PATH: /data/signal.db
      PORT: "3847"
      HOSTNAME: 0.0.0.0
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      KOL_HANDLES: ${KOL_HANDLES:-}
      KOL_HANDLES_MODE: ${KOL_HANDLES_MODE:-append}
      BLOCKED_HANDLES: ${BLOCKED_HANDLES:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
      AUTH_SECRET: ${AUTH_SECRET:-signl1-dev-secret-not-for-production}
      AUTH_URL: ${AUTH_URL:-http://127.0.0.1:3847}
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-1}
    volumes:
      - signal-data:/data
    restart: unless-stopped

  poller:
    build: .
    command: npm run poller
    # Host network: this VM's Compose bridge has no MASQUERADE for 172.18/16,
    # so api.x.com and WhatsApp time out from the container. Poller has no published ports.
    network_mode: host
    environment:
      DATABASE_PATH: /data/signal.db
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      KOL_HANDLES: ${KOL_HANDLES:-}
      KOL_HANDLES_MODE: ${KOL_HANDLES_MODE:-append}
      BLOCKED_HANDLES: ${BLOCKED_HANDLES:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_AUTH_DIR: /data/whatsapp-auth
    volumes:
      - signal-data:/data
    restart: unless-stopped

volumes:
  signal-data:
